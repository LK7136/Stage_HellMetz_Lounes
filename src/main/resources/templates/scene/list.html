<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div class="hm-card">
    <div class="hm-card-header d-flex justify-content-between align-items-center">
        <div>
            <div class="hm-tag">Gestion</div>
            <div class="hm-card-title">Scènes du HellMetz Festival</div>
        </div>

        <a href="${pageContext.request.contextPath}/backoffice/scenes/edit" class="hm-btn-primary">
            <span>＋</span>
            <span>Nouvelle scène</span>
        </a>
    </div>

    <c:choose>
        <c:when test="${empty scenes}">
            <p>Aucune scène enregistrée pour le moment.</p>
        </c:when>
        <c:otherwise>
            <div class="table-responsive">
                <table class="hm-table">
                    <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Description</th>
                        <th>Capacité</th>
                        <th>Type</th>
                        <th>Superficie</th>
                        <th>Plan technique</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <c:forEach var="s" items="${scenes}">
                        <tr>
                            <td><strong>${s.nom}</strong></td>
                            <td>${s.description}</td>
                            <td><span class="hm-pill">${s.capacite}</span></td>
                            <td>${s.type}</td>
                            <td>${s.superficie} m²</td>
                            <td>
                                <c:choose>
                                    <c:when test="${not empty s.urlPlanTechnique}">
                                        <a class="hm-link-site"
                                           href="${pageContext.request.contextPath}${s.urlPlanTechnique}"
                                           target="_blank" rel="noopener noreferrer">voir
                                        </a>
                                    </c:when>
                                    <c:otherwise>
                                        <span class="text-muted">—</span>
                                    </c:otherwise>
                                </c:choose>
                            </td>
                            <td>
                                <a class="hm-link-site"
                                   href="${pageContext.request.contextPath}/backoffice/scenes/edit?id=${s.id}">
                                    ✏️ éditer
                                </a>
                                &nbsp;|&nbsp;
                                <a class="hm-link-site"
                                   href="${pageContext.request.contextPath}/backoffice/scenes/delete?id=${s.id}"
                                   onclick="return confirm('Supprimer cette scène ?');">
                                    🗑️ supprimer
                                </a>
                            </td>
                        </tr>
                    </c:forEach>
                    </tbody>
                </table>
            </div>
        </c:otherwise>
    </c:choose>
</div>
