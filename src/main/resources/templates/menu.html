<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<div>
  <div class="backoffice-logo">HellMetz</div>
  <div class="backoffice-subtitle">Backoffice organisateur</div>

  <nav class="backoffice-nav">
    <a th:href="@{/templates/dashboard}"
       th:class="${activeMenu eq 'dashboard' ? 'active' : ''}">
      <span>🏠</span>
      <span>Tableau de bord</span>
    </a>

    <a th:href="@{/templates/scene}"
       th:class="${activeMenu eq 'scenes' ? 'active' : ''}">
      <span>🪩</span>
      <span>Scenes</span>
    </a>

    <a th:href="@{/templates/artiste}"
       th:class="${activeMenu eq 'artiste' ? 'active' : ''}">
      <span>🧑‍🎤</span>
      <span>Artistes</span>
    </a>

    <a th:href="@{/templates/groupe}"
       th:class="${activeMenu eq 'groupes' ? 'active' : ''}">
      <span>🎸</span>
      <span>Groupes</span>
    </a>

    <a th:href="@{/templates/concert}"
       th:class="${activeMenu eq 'concerts' ? 'active' : ''}">
      <span>🎵</span>
      <span>Concerts</span>
    </a>

    <a class="disabled"><span>📦</span><span>Logistique & Matériel (à venir)</span></a>
    <a class="disabled"><span>🧑‍🤝‍🧑</span><span>RH & Bénévoles (à venir)</span></a>
    <a class="disabled"><span>📍</span><span>Points d'intérêt (à venir)</span></a>
  </nav>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" th:href="@{/templates/dashboard}">HellMetz - Backoffice</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/templates/groupe}">Gestion des Groupes</a>
          </li>

          <li class="nav-item" th:if="${utilisateurConnecte.admin}">
            <a class="nav-link" th:href="@{/templates/utilisateurs}">Utilisateurs</a>
          </li>
        </ul>

        <ul class="navbar-nav ms-auto" th:if="${not empty utilisateurConnecte}">
          <li class="nav-item d-flex align-items-center">
            <span class="nav-link text-light me-3">
              <i class="bi bi-person-circle"></i> Bonjour,
              <strong th:text="${utilisateurConnecte.prenom + ' ' + utilisateurConnecte.nom}"></strong>
            </span>
          </li>
          <li class="nav-item">
            <a class="btn btn-outline-danger btn-sm mt-1" th:href="@{/logout}">
              <i class="bi bi-box-arrow-right"></i> Se déconnecter
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>
