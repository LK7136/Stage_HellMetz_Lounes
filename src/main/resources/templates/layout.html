<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${pageTitle != null ? pageTitle : 'HellMetz - Backoffice'}">HellMetz - Backoffice</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS Bootstrap (si tu as bien copié le thème) -->
    <link th:href="@{/static/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/static/css/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/static/css/templatemo-festava-live.css}" rel="stylesheet">

    <!-- Styles custom backoffice -->
    <link th:href="@{/static/css/backoffice.css}" rel="stylesheet">
</head>
<body>

<div class="backoffice-wrapper">

    <!-- SIDEBAR -->
    <aside class="backoffice-sidebar">
        <div th:replace="~{fragments/menu :: menu}"></div>
    </aside>

    <!-- MAIN -->
    <main class="backoffice-main">
        <header class="backoffice-header">
            <h1 th:text="${pageTitle != null ? pageTitle : 'Backoffice HellMetz'}">Backoffice HellMetz</h1>
            <p class="subtitle">Interface d’administration du festival (groupes, concerts, logistique…)</p>
        </header>

        <section>
            <div th:replace="~{::content}"></div>
        </section>
    </main>

</div>

<!-- Scripts du thème (optionnels si déjà présents côté front) -->
<script th:src="@{/static/js/jquery.min.js}"></script>
<script th:src="@{/static/js/bootstrap.min.js}"></script>
<script th:src="@{/static/js/jquery.sticky.js}"></script>
<script th:src="@{/static/js/click-scroll.js}"></script>
<script th:src="@{/static/js/custom.js}"></script>

</body>
</html>
