#version IA
# === Serveur ===
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:hellmetz-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=hellmetz

# === Base de donnees ===
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/hellmetz_db?sslmode=disable&connectTimeout=30&socketTimeout=60
spring.datasource.username=hellmetz
spring.datasource.password=VOLABEBOL_SERV_2261
spring.datasource.driver-class-name=org.postgresql.Driver

# === HikariCP ===
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=120000

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=hellmetz
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# === Thymeleaf ===
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Le temps maximum (en ms) que Hikari va attendre pour récupérer/fermer les connexions lors du shutdown
spring.datasource.hikari.leak-detection-threshold=2000
spring.datasource.hikari.idle-timeout=10000

# Force la déconnexion propre du driver PostgreSQL à la fermeture du pool
spring.datasource.hikari.register-mbeans=true

# Active l'arrêt propre (au lieu de l'arrêt brutal "immediate")
server.shutdown=graceful

# Temps maximum accordé à l'app pour terminer ses requêtes en cours (ex: 30 secondes)
# Si des requêtes dépassent ce délai, elles seront coupées, mais proprement côté client.
spring.lifecycle.timeout-per-shutdown-phase=30s